name: Temporary QTable 186 Dependency Resolver

on:
  push:
    branches:
      - ci/qtable-186-lock-resolver
    paths:
      - .tmp/qtable-186/requirements.in
      - .github/workflows/qtable-186-lock-resolver.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install resolver and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools pip-audit
          {
            python --version
            python -m pip --version
            pip-compile --version
            pip-audit --version
          } > .tmp/qtable-186/tool-versions.txt

      - name: Resolve hashed lock
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --strip-extras \
            --output-file=.tmp/qtable-186/requirements.lock \
            .tmp/qtable-186/requirements.in

      - name: Verify clean install and dependency consistency
        run: |
          python -m venv /tmp/qtable-186-app
          /tmp/qtable-186-app/bin/python -m pip install --upgrade pip
          /tmp/qtable-186-app/bin/python -m pip install \
            --require-hashes \
            -r .tmp/qtable-186/requirements.lock
          /tmp/qtable-186-app/bin/python -m pip check \
            | tee .tmp/qtable-186/pip-check.txt
          /tmp/qtable-186-app/bin/python -m pip freeze \
            > .tmp/qtable-186/resolved-freeze.txt

      - name: Generate Python license inventory
        run: |
          /tmp/qtable-186-app/bin/python - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path

          rows = []
          for dist in metadata.distributions():
              meta = dist.metadata
              name = meta.get("Name") or dist.name
              if not name or name.lower() in {"pip", "setuptools"}:
                  continue
              classifiers = [
                  value for value in meta.get_all("Classifier", [])
                  if value.startswith("License ::")
              ]
              rows.append({
                  "name": name,
                  "version": dist.version,
                  "license_expression": meta.get("License-Expression") or "",
                  "license": meta.get("License") or "",
                  "license_classifiers": classifiers,
                  "home_page": meta.get("Home-page") or meta.get("Project-URL") or "",
              })
          rows.sort(key=lambda row: row["name"].lower())
          Path(".tmp/qtable-186/python-licenses.json").write_text(
              json.dumps(rows, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit vulnerabilities and generate CycloneDX SBOM
        shell: bash
        run: |
          set +e
          pip-audit \
            --require-hashes \
            -r .tmp/qtable-186/requirements.lock \
            --format=json \
            --output=.tmp/qtable-186/pip-audit.json \
            --progress-spinner=off
          audit_status=$?
          echo "$audit_status" > .tmp/qtable-186/pip-audit-exit-code.txt

          pip-audit \
            --require-hashes \
            -r .tmp/qtable-186/requirements.lock \
            --format=cyclonedx-json \
            --output=.tmp/qtable-186/cyclonedx.json \
            --progress-spinner=off
          sbom_status=$?
          echo "$sbom_status" > .tmp/qtable-186/sbom-audit-exit-code.txt
          set -e

      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtable-186-python312-lock-evidence
          path: .tmp/qtable-186/
          if-no-files-found: error
          retention-days: 7
