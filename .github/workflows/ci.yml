name: Portal CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: ${{ vars.SITE_URL }}

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        id: install
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "generated_lockfile=false" >> "$GITHUB_OUTPUT"
            npm ci --no-audit --no-fund
          else
            echo "generated_lockfile=true" >> "$GITHUB_OUTPUT"
            npm install --no-audit --no-fund
          fi

      - name: Commit bootstrap lockfile
        if: github.event_name == 'push' && steps.install.outputs.generated_lockfile == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add generated npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify deployment configuration
        run: npm run verify:config

      - name: Verify source
        run: npm run verify:source

      - name: Verify documentation links
        run: npm run verify:links

      - name: Build
        run: npm run build

      - name: Verify generated site
        run: npm run verify:dist
