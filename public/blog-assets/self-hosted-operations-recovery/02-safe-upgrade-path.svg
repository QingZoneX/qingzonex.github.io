<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title id="title">QTable safe upgrade path</title>
<desc id="desc">A safe upgrade starts from an exact backend and frontend revision pair, captures backup and image identity, tests migrations and smoke checks in staging, deploys production only after verification, and preserves a rollback and restore decision point.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="800" rx="34" fill="url(#bg)"/>
<text x="64" y="72" font-size="38" font-weight="760" fill="#0f172a">Upgrade is a controlled state transition</text>
<text x="64" y="108" font-size="18" fill="#60708a">A new image is only one input; data schema, object storage, secrets and the verified revision pair must move together.</text>

<g filter="url(#shadow)"><rect x="58" y="165" width="1084" height="520" rx="30" fill="#fff" stroke="#d9e4f1"/></g>

<g font-size="13">
<rect x="88" y="225" width="176" height="102" rx="18" fill="#eef4ff" stroke="#cfdcf0"/>
<text x="110" y="256" font-weight="760" fill="#355d97">1 · IDENTIFY</text>
<text x="110" y="285" fill="#5d7390">exact QTable SHA</text>
<text x="110" y="307" fill="#5d7390">exact QTableUI SHA</text>

<path d="M276 276H316" stroke="#9eb3cc" stroke-width="4"/><path d="M308 268l14 8-14 8z" fill="#6d88ad"/>

<rect x="330" y="225" width="176" height="102" rx="18" fill="#fff9ef" stroke="#ecd6b5"/>
<text x="352" y="256" font-weight="760" fill="#74551f">2 · BACK UP</text>
<text x="352" y="285" fill="#816c4c">PostgreSQL</text>
<text x="352" y="307" fill="#816c4c">object storage + config</text>

<path d="M518 276H558" stroke="#9eb3cc" stroke-width="4"/><path d="M550 268l14 8-14 8z" fill="#6d88ad"/>

<rect x="572" y="225" width="176" height="102" rx="18" fill="#f4effb" stroke="#ddcff0"/>
<text x="594" y="256" font-weight="760" fill="#67478f">3 · STAGING</text>
<text x="594" y="285" fill="#715f83">restore copy</text>
<text x="594" y="307" fill="#715f83">alembic upgrade head</text>

<path d="M760 276H800" stroke="#9eb3cc" stroke-width="4"/><path d="M792 268l14 8-14 8z" fill="#6d88ad"/>

<rect x="814" y="225" width="176" height="102" rx="18" fill="#eef8f4" stroke="#c8e3d6"/>
<text x="836" y="256" font-weight="760" fill="#2d674f">4 · VERIFY</text>
<text x="836" y="285" fill="#587568">health + smoke</text>
<text x="836" y="307" fill="#587568">critical user flows</text>

<path d="M1002 276H1042" stroke="#9eb3cc" stroke-width="4"/><path d="M1034 268l14 8-14 8z" fill="#6d88ad"/>

<rect x="88" y="430" width="238" height="132" rx="20" fill="#eef8f4" stroke="#c8e3d6"/>
<text x="112" y="462" font-weight="760" fill="#2d674f">5 · PRODUCTION</text>
<text x="112" y="494" fill="#587568">deploy exact verified pair</text>
<text x="112" y="519" fill="#587568">run migration once</text>
<text x="112" y="544" fill="#587568">observe immediately</text>

<path d="M902 341V386H207V418" fill="none" stroke="#9eb3cc" stroke-width="4"/>
<path d="M199 410l8 14 8-14z" fill="#6d88ad"/>

<rect x="378" y="430" width="320" height="132" rx="20" fill="#fff4f4" stroke="#efc7c9"/>
<text x="404" y="462" font-weight="760" fill="#994148">DECISION POINT</text>
<text x="404" y="494" fill="#85595d">app rollback is not enough if schema/data changed</text>
<text x="404" y="519" fill="#85595d">choose forward fix vs data restore deliberately</text>
<text x="404" y="544" fill="#85595d">never assume downgrade is automatically safe</text>

<rect x="750" y="430" width="352" height="132" rx="20" fill="#f8fbff" stroke="#dce6f2"/>
<text x="776" y="462" font-weight="760" fill="#405570">RELEASE EVIDENCE</text>
<text x="776" y="494" fill="#66758a">revision pair · CI · full-stack smoke</text>
<text x="776" y="519" fill="#66758a">image digest · OCI revision · artifacts</text>
<text x="776" y="544" fill="#66758a">same identities used in production</text>
</g>

<rect x="175" y="718" width="850" height="52" rx="18" fill="#fff" stroke="#d5e1ee"/>
<text x="600" y="750" text-anchor="middle" font-size="16" font-weight="730" fill="#25364e">“Pull the newest image and restart” is deployment. Upgrade safety begins only when data state and recovery paths are part of the plan.</text>
</svg>