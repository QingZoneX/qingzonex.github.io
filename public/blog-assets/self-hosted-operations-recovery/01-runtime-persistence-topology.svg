<text x="488" y="278" font-size="22" font-weight="760" fill="#244c3c">QTable API</text>
<text x="488" y="307" font-size="14" fill="#587568">FastAPI · GraphQL · workers</text>
<text x="488" y="330" font-size="14" fill="#587568">entrypoint runs Alembic upgrade head</text>

