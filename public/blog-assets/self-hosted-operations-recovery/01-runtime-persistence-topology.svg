<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title id="title">QTable self-hosted runtime and persistence topology</title>
<desc id="desc">QTableUI is the public web edge. It proxies to the QTable API on a private network. QTable depends on PostgreSQL, Redis and S3-compatible object storage. PostgreSQL and MinIO store durable business data, Redis supports runtime state and cache, and every service has a health check in the canonical Compose stack.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="820" rx="34" fill="url(#bg)"/>
<text x="64" y="72" font-size="38" font-weight="760" fill="#0f172a">Self-hosting is a runtime topology, not a single container</text>
<text x="64" y="108" font-size="18" fill="#60708a">The operational boundary spans web, API, database, cache, object storage, migrations, secrets and health checks.</text>

<g filter="url(#shadow)">
<rect x="70" y="165" width="1060" height="540" rx="30" fill="#fff" stroke="#d9e4f1"/>
</g>

<rect x="100" y="220" width="235" height="122" rx="20" fill="#eef4ff" stroke="#cfdcf0"/>
<text x="126" y="252" font-size="14" font-weight="760" fill="#355d97">PUBLIC EDGE</text>
<text x="126" y="286" font-size="22" font-weight="760" fill="#1f3554">QTableUI</text>
<text x="126" y="314" font-size="14" fill="#5d7390">Nginx · SPA · /healthz</text>

