<text x="120" y="520" font-size="16" font-weight="700" fill="#33445b">Durable business state</text>
<text x="120" y="547" font-size="14" fill="#66758a">tables · records · permissions</text>
<text x="120" y="572" font-size="14" fill="#66758a">audit · automation · metadata</text>
<text x="120" y="596" font-size="14" fill="#66758a">named volume: postgres_data</text>

<rect x="456" y="455" width="285" height="158" rx="20" fill="#fff9ef" stroke="#ecd6b5"/>
<text x="482" y="487" font-size="14" font-weight="760" fill="#74551f">REDIS 7</text>
<text x="482" y="520" font-size="16" font-weight="700" fill="#65491b">Runtime acceleration</text>
<text x="482" y="547" font-size="14" fill="#816c4c">cache · rate limiting</text>
<text x="482" y="572" font-size="14" fill="#816c4c">appendonly persistence enabled</text>
<text x="482" y="596" font-size="14" fill="#816c4c">named volume: redis_data</text>

<rect x="818" y="455" width="285" height="158" rx="20" fill="#f4effb" stroke="#ddcff0"/>
