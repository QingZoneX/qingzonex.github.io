<rect x="774" y="214" width="318" height="132" rx="20" fill="#fff4f4" stroke="#efc7c9"/>
<text x="800" y="246" font-size="14" font-weight="760" fill="#994148">HEALTH CONTRACT</text>
<text x="800" y="280" font-size="14" fill="#85595d">Postgres · pg_isready</text>
<text x="800" y="304" font-size="14" fill="#85595d">Redis · PING · MinIO · health/live</text>
<text x="800" y="328" font-size="14" fill="#85595d">QTable · / · QTableUI · /healthz</text>

<rect x="180" y="738" width="840" height="52" rx="18" fill="#eef4ff" stroke="#cfdcf0"/>
<text x="600" y="770" text-anchor="middle" font-size="16" font-weight="730" fill="#355d97">The recovery unit is the whole data contract: database + object storage + compatible application revision + stable secrets and configuration.</text>
