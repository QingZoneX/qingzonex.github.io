<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">From reviewed source to verifiable release artifact</title>
  <desc id="desc">A release trust chain connects an exact source revision to CI evidence, dependency and license checks, vulnerability scanning, image build metadata, SBOM and provenance attestations, an immutable digest, and a release record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19304f"/><stop offset="1" stop-color="#0d192d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <text x="68" y="72" font-size="38" font-weight="760" fill="#0f172a">A public repository is only the start of the trust chain</text>
  <text x="68" y="108" font-size="18" fill="#60708a">The question is not only “can I read the source?” but “can I connect this artifact back to the exact source and checks that produced it?”</text>

  <g filter="url(#shadow)">
    <rect x="62" y="176" width="1076" height="454" rx="30" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <g font-size="13">
    <rect x="90" y="228" width="170" height="90" rx="18" fill="#eef4ff" stroke="#cfdcf0"/>
    <text x="110" y="254" font-weight="760" fill="#355d97">1 · Exact revision</text>
    <text x="110" y="279" fill="#5d7390">full commit SHA</text>
    <text x="110" y="301" fill="#5d7390">reviewed source tree</text>

    <path d="M270 273H322" stroke="#afc2da" stroke-width="4"/><path d="M314 265l14 8-14 8z" fill="#6d88ad"/>

    <rect x="330" y="228" width="170" height="90" rx="18" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="350" y="254" font-weight="760" fill="#2d674f">2 · CI evidence</text>
    <text x="350" y="279" fill="#587568">tests / policy gates</text>
    <text x="350" y="301" fill="#587568">exact-revision runs</text>

    <path d="M510 273H562" stroke="#afc2da" stroke-width="4"/><path d="M554 265l14 8-14 8z" fill="#6d88ad"/>

    <rect x="570" y="228" width="170" height="90" rx="18" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="590" y="254" font-weight="760" fill="#74551f">3 · Dependency proof</text>
    <text x="590" y="279" fill="#816c4c">audit / license</text>
    <text x="590" y="301" fill="#816c4c">SBOM inventory</text>

    <path d="M750 273H802" stroke="#afc2da" stroke-width="4"/><path d="M794 265l14 8-14 8z" fill="#6d88ad"/>

    <rect x="810" y="228" width="170" height="90" rx="18" fill="#fff4f4" stroke="#efc7c9"/>
    <text x="830" y="254" font-weight="760" fill="#994148">4 · Artifact gate</text>
    <text x="830" y="279" fill="#85595d">container CVE scan</text>
    <text x="830" y="301" fill="#85595d">release identity check</text>

    <path d="M990 273H1035" stroke="#afc2da" stroke-width="4"/><path d="M1027 265l14 8-14 8z" fill="#6d88ad"/>

    <rect x="866" y="378" width="244" height="174" rx="22" fill="url(#dark)" stroke="#355979"/>
    <text x="890" y="409" font-size="14" font-weight="760" fill="#bcdcff">5 · PUBLISHED ARTIFACT</text>
    <text x="890" y="448" font-size="22" font-weight="760" fill="#fff">Immutable digest</text>
    <text x="890" y="478" fill="#c7daed">OCI revision metadata</text>
    <text x="890" y="503" fill="#c7daed">SBOM + provenance</text>
    <text x="890" y="528" fill="#c7daed">release record</text>
  </g>

  <path d="M950 327V370" stroke="#89a2c0" stroke-width="4"/><path d="M942 362l8 14 8-14z" fill="#6d88ad"/>

  <rect x="90" y="382" width="696" height="170" rx="22" fill="#f7faff" stroke="#dce6f2"/>
  <text x="118" y="418" font-size="15" font-weight="760" fill="#405570">What a reviewer should be able to answer</text>
  <text x="118" y="455" font-size="14" fill="#5f6f83">Which source revision was built?</text>
  <text x="118" y="482" font-size="14" fill="#5f6f83">Which checks passed for that exact revision?</text>
  <text x="118" y="509" font-size="14" fill="#5f6f83">What dependencies and licenses are inside?</text>
  <text x="430" y="455" font-size="14" fill="#5f6f83">Which digest identifies the artifact?</text>
  <text x="430" y="482" font-size="14" fill="#5f6f83">What build process produced it?</text>
  <text x="430" y="509" font-size="14" fill="#5f6f83">Can that evidence be verified later?</text>

  <rect x="160" y="690" width="880" height="72" rx="22" fill="#eef8f4" stroke="#c8e3d6"/>
  <text x="600" y="722" text-anchor="middle" font-size="17" font-weight="730" fill="#285f4b">Open source exposes the code. Supply-chain evidence connects released artifacts back to that code.</text>
  <text x="600" y="747" text-anchor="middle" font-size="14" fill="#587568">Without the connection, a public repository and a downloadable image can still be two unrelated facts.</text>
</svg>