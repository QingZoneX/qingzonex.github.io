<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">QTable dependency evidence differs between backend and frontend</title>
  <desc id="desc">The frontend uses package-lock and npm ci plus audit, license checks and CycloneDX SBOM. The backend has requirements.in plus vulnerability, license and CycloneDX audit tooling, and a PEP 751 pylock workflow, but the lock file is not currently materialized in the repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <text x="68" y="72" font-size="38" font-weight="760" fill="#0f172a">An SBOM tells you what was resolved—not whether resolution was deterministic</text>
  <text x="68" y="108" font-size="18" fill="#60708a">Inventory, vulnerability scanning, license policy, and dependency locking solve different parts of the trust problem.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="176" width="500" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="630" y="176" width="500" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="102" y="216" font-size="14" font-weight="760" fill="#4d74b9">QTABLEUI · NODE</text>
  <text x="102" y="257" font-size="25" font-weight="750" fill="#0f172a">Locked installation path</text>
  <g font-size="13">
    <rect x="102" y="294" width="436" height="58" rx="14" fill="#eef4ff" stroke="#cfdcf0"/>
    <text x="122" y="328" font-weight="700" fill="#355d97">package-lock.json + npm ci</text>
    <rect x="102" y="368" width="206" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="122" y="395" font-weight="700" fill="#2d674f">npm audit</text><text x="122" y="417" fill="#587568">vulnerability gate</text>
    <rect x="332" y="368" width="206" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="352" y="395" font-weight="700" fill="#2d674f">license policy</text><text x="352" y="417" fill="#587568">distribution review</text>
    <rect x="102" y="448" width="436" height="68" rx="14" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="122" y="476" font-weight="700" fill="#74551f">npm sbom → CycloneDX</text>
    <text x="122" y="498" fill="#816c4c">uploaded as CI dependency evidence</text>
  </g>
  <text x="102" y="570" font-size="13" fill="#66758a">The Docker build also uses npm ci --ignore-scripts</text>
  <text x="102" y="593" font-size="13" fill="#66758a">against the committed lockfile.</text>

  <text x="662" y="216" font-size="14" font-weight="760" fill="#8c6926">QTABLE · PYTHON</text>
  <text x="662" y="257" font-size="25" font-weight="750" fill="#0f172a">Audit ready, lock not yet closed</text>
  <g font-size="13">
    <rect x="662" y="294" width="436" height="58" rx="14" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="682" y="328" font-weight="700" fill="#74551f">requirements.in uses version ranges</text>
    <rect x="662" y="368" width="206" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="682" y="395" font-weight="700" fill="#2d674f">pip-audit</text><text x="682" y="417" fill="#587568">vulnerability gate</text>
    <rect x="892" y="368" width="206" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="912" y="395" font-weight="700" fill="#2d674f">pip-licenses</text><text x="912" y="417" fill="#587568">license inventory</text>
    <rect x="662" y="448" width="436" height="68" rx="14" fill="#eef4ff" stroke="#cfdcf0"/>
    <text x="682" y="476" font-weight="700" fill="#355d97">cyclonedx-py → reproducible SBOM output</text>
    <text x="682" y="498" fill="#5d7390">captures the installed environment used in CI</text>
    <rect x="662" y="532" width="436" height="80" rx="14" fill="#fff4f4" stroke="#efc7c9"/>
    <text x="682" y="560" font-weight="700" fill="#994148">PEP 751 lock policy exists</text>
    <text x="682" y="583" fill="#85595d">pylock.toml is not currently materialized</text>
    <text x="682" y="603" fill="#85595d">so release resolution is not fully deterministic yet</text>
  </g>

  <rect x="174" y="716" width="852" height="62" rx="20" fill="#fff" stroke="#d5e1ee"/>
  <text x="600" y="753" text-anchor="middle" font-size="16" font-weight="730" fill="#25364e">SBOM = inventory. Lockfile = resolution constraint. Audit = risk check. They complement each other; none replaces the others.</text>
</svg>