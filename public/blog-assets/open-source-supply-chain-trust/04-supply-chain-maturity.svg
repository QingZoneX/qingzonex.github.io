<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">QTable supply-chain trust today and the remaining gaps</title>
  <desc id="desc">Current strengths include dependency audits, license checks, secret scans, exact-revision release gates, Trivy container scanning, SBOM and provenance requests, OCI revision metadata, multi-architecture builds and full-stack smoke testing. Remaining gaps include the missing Python lock, mutable action and base-image tags, no explicit artifact signing or consumer verification policy, and short-lived CI evidence retention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="840" rx="34" fill="url(#bg)"/>
  <text x="68" y="72" font-size="38" font-weight="760" fill="#0f172a">Supply-chain trust is a maturity ladder, not one checkbox</text>
  <text x="68" y="108" font-size="18" fill="#60708a">QTable already has several strong release controls. The remaining work is about making the chain more deterministic, immutable, and independently verifiable.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="174" width="500" height="520" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="630" y="174" width="500" height="520" rx="28" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="102" y="217" font-size="14" font-weight="760" fill="#2c7659">ALREADY IN THE PIPELINE</text>
  <g font-size="13">
    <rect x="102" y="252" width="436" height="58" rx="14" fill="#eef8f4" stroke="#c8e3d6"/><text x="122" y="286" fill="#315f50">Dependency vulnerability + license gates</text>
    <rect x="102" y="324" width="436" height="58" rx="14" fill="#eef8f4" stroke="#c8e3d6"/><text x="122" y="358" fill="#315f50">Secret/history scans + open-source readiness checks</text>
    <rect x="102" y="396" width="436" height="58" rx="14" fill="#eef8f4" stroke="#c8e3d6"/><text x="122" y="430" fill="#315f50">Trivy HIGH/CRITICAL container vulnerability gate</text>
    <rect x="102" y="468" width="436" height="58" rx="14" fill="#eef8f4" stroke="#c8e3d6"/><text x="122" y="502" fill="#315f50">BuildKit SBOM + provenance: mode=max</text>
    <rect x="102" y="540" width="436" height="58" rx="14" fill="#eef8f4" stroke="#c8e3d6"/><text x="122" y="574" fill="#315f50">OCI source / version / revision metadata + image digest</text>
    <rect x="102" y="612" width="436" height="58" rx="14" fill="#eef8f4" stroke="#c8e3d6"/><text x="122" y="646" fill="#315f50">Exact QTable + QTableUI full-stack release smoke evidence</text>
  </g>

  <text x="662" y="217" font-size="14" font-weight="760" fill="#994148">STILL WORTH CLOSING</text>
  <g font-size="13">
    <rect x="662" y="252" width="436" height="76" rx="14" fill="#fff4f4" stroke="#efc7c9"/>
    <text x="682" y="281" font-weight="700" fill="#994148">Materialize the Python PEP 751 lock</text>
    <text x="682" y="305" fill="#85595d">policy exists; pylock.toml is not in the current tree</text>

    <rect x="662" y="344" width="436" height="76" rx="14" fill="#fff4f4" stroke="#efc7c9"/>
    <text x="682" y="373" font-weight="700" fill="#994148">Pin build dependencies immutably</text>
    <text x="682" y="397" fill="#85595d">Actions and base images still use mutable version tags</text>

    <rect x="662" y="436" width="436" height="76" rx="14" fill="#fff4f4" stroke="#efc7c9"/>
    <text x="682" y="465" font-weight="700" fill="#994148">Add an explicit signing / verification policy</text>
    <text x="682" y="489" fill="#85595d">provenance exists, but consumer verification is not yet closed</text>

    <rect x="662" y="528" width="436" height="76" rx="14" fill="#fff4f4" stroke="#efc7c9"/>
    <text x="682" y="557" font-weight="700" fill="#994148">Make release evidence durable</text>
    <text x="682" y="581" fill="#85595d">several CI artifacts are retained for only 14 days</text>

    <rect x="662" y="620" width="436" height="50" rx="14" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="682" y="651" font-weight="700" fill="#74551f">Automatic release-policy enforcement can tighten further</text>
  </g>

  <rect x="150" y="736" width="900" height="62" rx="20" fill="#eef4ff" stroke="#cfdcf0"/>
  <text x="600" y="773" text-anchor="middle" font-size="16" font-weight="730" fill="#355d97">The goal is not “perfect security.” It is making every release claim easier for someone else to verify without trusting the maintainer's memory.</text>
</svg>