<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Tags are labels while digests identify immutable container artifacts</title>
  <desc id="desc">A release tag selects a source revision and a container tag points to an image, but moving tags can change. The release record should preserve the full source commit pair, image digests, OCI revision metadata, SBOM and provenance for verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19304f"/><stop offset="1" stop-color="#0d192d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <text x="68" y="72" font-size="38" font-weight="760" fill="#0f172a">A tag is a name. A digest is an artifact identity.</text>
  <text x="68" y="108" font-size="18" fill="#60708a">Release trust improves when every human-friendly label can be resolved to immutable evidence.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="176" width="1060" height="470" rx="30" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="105" y="221" font-size="14" font-weight="760" fill="#4d74b9">HUMAN-FRIENDLY LABELS</text>
  <g font-size="13">
    <rect x="105" y="258" width="250" height="76" rx="16" fill="#eef4ff" stroke="#cfdcf0"/>
    <text x="127" y="286" font-weight="700" fill="#355d97">Git tag</text><text x="127" y="312" fill="#5d7390">v0.1.2-alpha</text>
    <rect x="105" y="354" width="250" height="76" rx="16" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="127" y="382" font-weight="700" fill="#74551f">Image tag</text><text x="127" y="408" fill="#816c4c">0.1.2-alpha / alpha / latest</text>
    <text x="105" y="482" font-size="13" fill="#66758a">Useful for people and automation,</text>
    <text x="105" y="504" font-size="13" fill="#66758a">but some tags can move.</text>
  </g>

  <path d="M386 402H487" stroke="#afc2da" stroke-width="5"/><path d="M478 393l16 9-16 9z" fill="#6d88ad"/>

  <rect x="500" y="244" width="260" height="310" rx="24" fill="url(#dark)" stroke="#355979"/>
  <text x="530" y="282" font-size="14" font-weight="760" fill="#bcdcff">IMMUTABLE IDENTITY</text>
  <text x="530" y="329" font-size="23" font-weight="760" fill="#fff">sha256:…</text>
  <text x="530" y="362" font-size="13" fill="#c7daed">container manifest digest</text>
  <rect x="530" y="399" width="200" height="58" rx="13" fill="#24476c"/>
  <text x="550" y="425" font-size="13" font-weight="700" fill="#fff">OCI revision</text>
  <text x="550" y="447" font-size="13" fill="#c7daed">full source commit</text>
  <rect x="530" y="473" width="200" height="50" rx="13" fill="#24476c"/>
  <text x="550" y="504" font-size="13" fill="#c7daed">SBOM + provenance refs</text>

  <path d="M772 402H873" stroke="#afc2da" stroke-width="5"/><path d="M864 393l16 9-16 9z" fill="#6d88ad"/>

  <text x="900" y="221" font-size="14" font-weight="760" fill="#2c7659">RELEASE RECORD</text>
  <g font-size="13">
    <rect x="895" y="258" width="200" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="915" y="286" font-weight="700" fill="#2d674f">QTable SHA</text><text x="915" y="307" fill="#587568">40-char commit</text>
    <rect x="895" y="338" width="200" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="915" y="366" font-weight="700" fill="#2d674f">QTableUI SHA</text><text x="915" y="387" fill="#587568">40-char commit</text>
    <rect x="895" y="418" width="200" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="915" y="446" font-weight="700" fill="#2d674f">image digests</text><text x="915" y="467" fill="#587568">backend + frontend</text>
    <rect x="895" y="498" width="200" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="915" y="526" font-weight="700" fill="#2d674f">CI / E2E evidence</text><text x="915" y="547" fill="#587568">exact revision runs</text>
  </g>

  <rect x="152" y="700" width="896" height="68" rx="22" fill="#fff" stroke="#d5e1ee"/>
  <text x="600" y="740" text-anchor="middle" font-size="17" font-weight="730" fill="#25364e">“I pulled qingzonex/qtable:alpha” is not enough for an audit. “I ran digest X built from commit Y with evidence Z” is.</text>
</svg>