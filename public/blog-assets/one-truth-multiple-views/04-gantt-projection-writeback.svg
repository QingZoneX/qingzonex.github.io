<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Gantt projection and write back</title>
  <desc id="desc">QTable Gantt maps configured record fields to visual task-bar properties. Dragging a task bar or changing progress writes values back to the same record. Missing dates may receive visual fallback values that are not business state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafcff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="840" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">Gantt is a projection over configured fields</text>
  <text x="70" y="108" font-size="18" fill="#60708a">The timeline reads from Record fields and writes edits back to those same fields.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="178" width="310" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="445" y="178" width="310" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="830" y="178" width="310" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="90" y="218" font-size="14" font-weight="760" fill="#4d74b9">VIEW CONFIG</text>
  <text x="90" y="258" font-size="24" font-weight="750" fill="#0f172a">Choose field mapping</text>
  <g font-size="13">
    <rect x="90" y="296" width="250" height="58" rx="14" fill="#f7faff" stroke="#dce6f2"/><text x="110" y="331" fill="#455a72">startFieldId → Start Date</text>
    <rect x="90" y="370" width="250" height="58" rx="14" fill="#f7faff" stroke="#dce6f2"/><text x="110" y="405" fill="#455a72">endFieldId → Due Date</text>
    <rect x="90" y="444" width="250" height="58" rx="14" fill="#f7faff" stroke="#dce6f2"/><text x="110" y="479" fill="#455a72">progressFieldId → Progress</text>
  </g>
  <text x="90" y="548" font-size="13" fill="#66758a">The mapping belongs to this View.</text>
  <text x="90" y="570" font-size="13" fill="#66758a">The values remain on the Record.</text>

  <path d="M378 426H437" stroke="#afc2da" stroke-width="4"/><path d="M429 418l14 8-14 8z" fill="#6d88ad"/>

  <text x="475" y="218" font-size="14" font-weight="760" fill="#4d74b9">VISUAL PROJECTION</text>
  <text x="475" y="258" font-size="24" font-weight="750" fill="#0f172a">Build task bars</text>
  <rect x="475" y="296" width="250" height="122" rx="16" fill="#eef8f4" stroke="#c8e3d6"/>
  <text x="495" y="324" font-size="14" font-weight="700" fill="#2d674f">Derived render fields</text>
  <text x="495" y="349" font-size="13" fill="#587568">__gantt_start</text>
  <text x="495" y="372" font-size="13" fill="#587568">__gantt_end</text>
  <text x="495" y="395" font-size="13" fill="#587568">__gantt_progress</text>
  <rect x="475" y="444" width="250" height="112" rx="16" fill="#fff9ef" stroke="#ecd6b5"/>
  <text x="495" y="472" font-size="14" font-weight="700" fill="#74551f">Current visual fallback</text>
  <text x="495" y="496" font-size="13" fill="#846e4e">missing dates may be synthesized</text>
  <text x="495" y="518" font-size="13" fill="#846e4e">for rendering only</text>
  <text x="495" y="540" font-size="13" fill="#846e4e">→ not persisted business truth</text>
  <text x="475" y="604" font-size="13" fill="#66758a">A projection may add render-only data,</text>
  <text x="475" y="626" font-size="13" fill="#66758a">but it should not masquerade as stored state.</text>

  <path d="M763 426H822" stroke="#afc2da" stroke-width="4"/><path d="M814 418l14 8-14 8z" fill="#6d88ad"/>

  <text x="860" y="218" font-size="14" font-weight="760" fill="#4d74b9">WRITE BACK</text>
  <text x="860" y="258" font-size="24" font-weight="750" fill="#0f172a">Edit the same Record</text>
  <rect x="860" y="296" width="250" height="88" rx="16" fill="#eef8f4" stroke="#c8e3d6"/>
  <text x="880" y="324" font-size="14" font-weight="700" fill="#2d674f">Move task bar</text>
  <text x="880" y="348" font-size="13" fill="#587568">update start field</text>
  <text x="880" y="369" font-size="13" fill="#587568">update end field</text>
  <rect x="860" y="404" width="250" height="78" rx="16" fill="#eef8f4" stroke="#c8e3d6"/>
  <text x="880" y="432" font-size="14" font-weight="700" fill="#2d674f">Adjust progress</text>
  <text x="880" y="456" font-size="13" fill="#587568">update configured progress field</text>
  <rect x="860" y="506" width="250" height="104" rx="16" fill="#fff4f4" stroke="#efc7c9"/>
  <text x="880" y="534" font-size="14" font-weight="700" fill="#994148">Current gap</text>
  <text x="880" y="558" font-size="13" fill="#85595d">start / end are two updateRecord calls</text>
  <text x="880" y="580" font-size="13" fill="#85595d">rather than one atomic range mutation</text>

  <rect x="166" y="724" width="868" height="72" rx="22" fill="#fff" stroke="#d5e1ee"/>
  <text x="600" y="756" text-anchor="middle" font-size="16" font-weight="730" fill="#25364e">A View may derive presentation data.</text>
  <text x="600" y="780" text-anchor="middle" font-size="16" fill="#506178">When the user edits real task state, the write must return to the canonical Record fields.</text>
</svg>