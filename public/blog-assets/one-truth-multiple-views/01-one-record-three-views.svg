<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">One record, multiple views</title>
  <desc id="desc">A single QTable record and field model is projected into Grid, Kanban and Gantt views. The views change arrangement and interaction, not the underlying business fact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafcff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18304f"/><stop offset="1" stop-color="#0d192d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">One business fact, three ways to work with it</text>
  <text x="70" y="108" font-size="18" fill="#60708a">Grid, Kanban and Gantt should project the same Record—not maintain three copies of the task.</text>

  <g filter="url(#shadow)">
    <rect x="405" y="178" width="390" height="260" rx="30" fill="url(#core)" stroke="#355979"/>
    <rect x="60" y="520" width="310" height="210" rx="26" fill="#fff" stroke="#d9e4f1"/>
    <rect x="445" y="520" width="310" height="210" rx="26" fill="#fff" stroke="#d9e4f1"/>
    <rect x="830" y="520" width="310" height="210" rx="26" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="600" y="222" text-anchor="middle" font-size="14" font-weight="760" fill="#bcdcff">CANONICAL BUSINESS STATE</text>
  <text x="600" y="265" text-anchor="middle" font-size="28" font-weight="760" fill="#fff">TableRecord · id = task_42</text>
  <g font-size="15" fill="#dbe9f7">
    <text x="455" y="310">title</text><text x="615" y="310" fill="#9fc5ec">Launch billing v2</text>
    <text x="455" y="342">status</text><text x="615" y="342" fill="#9fc5ec">in_progress</text>
    <text x="455" y="374">start / end</text><text x="615" y="374" fill="#9fc5ec">Oct 03 → Oct 12</text>
    <text x="455" y="406">progress</text><text x="615" y="406" fill="#9fc5ec">40%</text>
  </g>

  <path d="M505 444L225 506" stroke="#aabed7" stroke-width="4" fill="none"/>
  <path d="M600 444V505" stroke="#aabed7" stroke-width="4"/>
  <path d="M695 444L975 506" stroke="#aabed7" stroke-width="4" fill="none"/>

  <text x="90" y="560" font-size="14" font-weight="760" fill="#4d74b9">GRID</text>
  <text x="90" y="596" font-size="24" font-weight="750" fill="#0f172a">Rows &amp; columns</text>
  <rect x="90" y="622" width="250" height="68" rx="14" fill="#f7faff" stroke="#dce6f2"/>
  <text x="110" y="648" font-size="13" fill="#56667c">Edit status cell</text>
  <text x="110" y="670" font-size="13" font-weight="700" fill="#355d97">→ update the same Record</text>

  <text x="475" y="560" font-size="14" font-weight="760" fill="#4d74b9">KANBAN</text>
  <text x="475" y="596" font-size="24" font-weight="750" fill="#0f172a">Columns &amp; cards</text>
  <rect x="475" y="622" width="250" height="68" rx="14" fill="#f7faff" stroke="#dce6f2"/>
  <text x="495" y="648" font-size="13" fill="#56667c">Drag card to “Done”</text>
  <text x="495" y="670" font-size="13" font-weight="700" fill="#355d97">→ update Record.status</text>

  <text x="860" y="560" font-size="14" font-weight="760" fill="#4d74b9">GANTT</text>
  <text x="860" y="596" font-size="24" font-weight="750" fill="#0f172a">Timeline &amp; progress</text>
  <rect x="860" y="622" width="250" height="68" rx="14" fill="#f7faff" stroke="#dce6f2"/>
  <text x="880" y="648" font-size="13" fill="#56667c">Move task bar</text>
  <text x="880" y="670" font-size="13" font-weight="700" fill="#355d97">→ update start / end fields</text>

  <rect x="180" y="760" width="840" height="42" rx="18" fill="#eef8f4" stroke="#c8e3d6"/>
  <text x="600" y="787" text-anchor="middle" font-size="16" font-weight="720" fill="#285f4b">A View changes how the record is organized and edited—not what object the record is.</text>
</svg>