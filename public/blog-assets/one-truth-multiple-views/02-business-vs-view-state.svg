<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Business state versus view state</title>
  <desc id="desc">QTable separates canonical record data from view configuration. View configuration can hold filters, sorts, grouping, hidden fields, Gantt field mapping and Kanban presentation settings without duplicating record values.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">Keep business state and view state separate</text>
  <text x="70" y="108" font-size="18" fill="#60708a">The same task may look different in two Views without becoming two different tasks.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="175" width="500" height="500" rx="30" fill="#fff" stroke="#d9e4f1"/>
    <rect x="640" y="175" width="500" height="500" rx="30" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="92" y="217" font-size="14" font-weight="760" fill="#2c7659">BUSINESS STATE</text>
  <text x="92" y="258" font-size="26" font-weight="760" fill="#0f172a">TableRecord.data</text>
  <text x="92" y="289" font-size="14" fill="#64748b">Shared across every View</text>
  <g font-size="14">
    <rect x="92" y="326" width="436" height="55" rx="13" fill="#eef8f4" stroke="#c8e3d6"/><text x="114" y="359" fill="#315f50">status = in_progress</text>
    <rect x="92" y="395" width="436" height="55" rx="13" fill="#eef8f4" stroke="#c8e3d6"/><text x="114" y="428" fill="#315f50">owner = user_17</text>
    <rect x="92" y="464" width="436" height="55" rx="13" fill="#eef8f4" stroke="#c8e3d6"/><text x="114" y="497" fill="#315f50">start / end = Oct 03 / Oct 12</text>
    <rect x="92" y="533" width="436" height="55" rx="13" fill="#eef8f4" stroke="#c8e3d6"/><text x="114" y="566" fill="#315f50">progress = 40</text>
  </g>
  <text x="92" y="625" font-size="13" fill="#66758a">AI, Automation and people should all mutate this same state.</text>

  <text x="672" y="217" font-size="14" font-weight="760" fill="#4d74b9">VIEW STATE</text>
  <text x="672" y="258" font-size="26" font-weight="760" fill="#0f172a">TableView.config</text>
  <text x="672" y="289" font-size="14" fill="#64748b">Specific to how one View presents the table</text>
  <g font-size="14">
    <rect x="672" y="326" width="436" height="55" rx="13" fill="#f7faff" stroke="#dce6f2"/><text x="694" y="359" fill="#485b73">filters · sorts · groupConfig</text>
    <rect x="672" y="395" width="436" height="55" rx="13" fill="#f7faff" stroke="#dce6f2"/><text x="694" y="428" fill="#485b73">hiddenFieldIds</text>
    <rect x="672" y="464" width="436" height="55" rx="13" fill="#f7faff" stroke="#dce6f2"/><text x="694" y="497" fill="#485b73">ganttConfig → start / end / progress field IDs</text>
    <rect x="672" y="533" width="436" height="55" rx="13" fill="#f7faff" stroke="#dce6f2"/><text x="694" y="566" fill="#485b73">boardConfig → group / lane / visible card fields</text>
  </g>
  <text x="672" y="625" font-size="13" fill="#66758a">Changing a View should not rewrite the underlying task merely to render it.</text>

  <rect x="158" y="720" width="884" height="62" rx="22" fill="#fff" stroke="#d5e1ee"/>
  <text x="600" y="757" text-anchor="middle" font-size="17" font-weight="730" fill="#25364e">Filter, sort, grouping and layout are interpretation; status, dates and ownership are business facts.</text>
</svg>