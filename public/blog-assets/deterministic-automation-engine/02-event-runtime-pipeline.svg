<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title id="title">QTable automation event pipeline</title>
<desc id="desc">Record changes are committed into ChangeSets and ChangeItems, then materialized into durable AutomationEvents. Scheduled and due-date scans create synthetic events. The worker claims events, matches rules, rechecks permissions and conditions, executes actions, and stores execution history.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="820" rx="34" fill="url(#bg)"/>
<text x="66" y="72" font-size="38" font-weight="760" fill="#0f172a">QTable does not run automation inline with every write</text>
<text x="66" y="108" font-size="18" fill="#60708a">Committed business changes become durable events; the worker can recover, retry, and audit them later.</text>
<g filter="url(#shadow)"><rect x="58" y="165" width="1084" height="525" rx="30" fill="#fff" stroke="#d9e4f1"/></g>

<g font-size="13">
<rect x="90" y="218" width="170" height="86" rx="16" fill="#eef4ff" stroke="#cfdcf0"/>
<text x="112" y="247" font-weight="750" fill="#355d97">Record write</text>
<text x="112" y="270" fill="#5d7390">user / AI / automation</text>
<text x="112" y="291" fill="#5d7390">commits business state</text>

<path d="M270 260H320" stroke="#9eb3cc" stroke-width="4"/><path d="M312 252l14 8-14 8z" fill="#6d88ad"/>

<rect x="330" y="218" width="190" height="86" rx="16" fill="#eef8f4" stroke="#c8e3d6"/>
<text x="352" y="247" font-weight="750" fill="#2d674f">ChangeSet / ChangeItem</text>
<text x="352" y="270" fill="#587568">durable mutation evidence</text>
<text x="352" y="291" fill="#587568">source + actor + trace</text>

<path d="M530 260H580" stroke="#9eb3cc" stroke-width="4"/><path d="M572 252l14 8-14 8z" fill="#6d88ad"/>

<rect x="590" y="218" width="188" height="86" rx="16" fill="#fff9ef" stroke="#ecd6b5"/>
<text x="612" y="247" font-weight="750" fill="#74551f">AutomationEvent</text>
<text x="612" y="270" fill="#816c4c">queued in database</text>
<text x="612" y="291" fill="#816c4c">before / after / fields</text>

<path d="M788 260H838" stroke="#9eb3cc" stroke-width="4"/><path d="M830 252l14 8-14 8z" fill="#6d88ad"/>

<rect x="848" y="218" width="250" height="86" rx="16" fill="#f4effb" stroke="#ddcff0"/>
<text x="870" y="247" font-weight="750" fill="#67478f">Worker claim + rule match</text>
<text x="870" y="270" fill="#715f83">lease + SKIP LOCKED</text>
<text x="870" y="291" fill="#715f83">trigger type / field transition</text>

<rect x="90" y="392" width="188" height="98" rx="16" fill="#f7faff" stroke="#dce6f2"/>
<text x="112" y="421" font-weight="750" fill="#405570">Scheduled scan</text>
<text x="112" y="444" fill="#66758a">next_run_at cursor</text>
<text x="112" y="466" fill="#66758a">deterministic event id</text>

<rect x="90" y="516" width="188" height="98" rx="16" fill="#f7faff" stroke="#dce6f2"/>
<text x="112" y="545" font-weight="750" fill="#405570">Due-date scan</text>
<text x="112" y="568" fill="#66758a">timezone-aware</text>
<text x="112" y="590" fill="#66758a">row visibility filtered</text>

<path d="M290 442H530V322H590" fill="none" stroke="#9eb3cc" stroke-width="4"/>
<path d="M290 566H550V338H590" fill="none" stroke="#9eb3cc" stroke-width="4"/>

<rect x="360" y="390" width="272" height="220" rx="20" fill="#f8fbff" stroke="#dce6f2"/>
<text x="385" y="422" font-size="14" font-weight="760" fill="#405570">Execution gate</text>
<text x="385" y="457" fill="#66758a">1 · runtime permission</text>
<text x="385" y="484" fill="#66758a">2 · row access</text>
<text x="385" y="511" fill="#66758a">3 · normalized conditions</text>
<text x="385" y="538" fill="#66758a">4 · loop-depth guard</text>
<text x="385" y="565" fill="#66758a">5 · rule enabled + version</text>

<path d="M984 316V372H650" fill="none" stroke="#9eb3cc" stroke-width="4"/><path d="M658 364l-14 8 14 8z" fill="#6d88ad"/>

<rect x="684" y="390" width="192" height="220" rx="20" fill="#eef8f4" stroke="#c8e3d6"/>
<text x="707" y="422" font-size="14" font-weight="760" fill="#2d674f">Actions v1</text>
<text x="707" y="458" fill="#587568">update_record</text>
<text x="707" y="486" fill="#587568">create_record</text>
<text x="707" y="514" fill="#587568">notify</text>
<text x="707" y="552" fill="#587568">successful steps commit</text>
<text x="707" y="578" fill="#587568">with execution trace id</text>

<path d="M886 500H920" stroke="#9eb3cc" stroke-width="4"/><path d="M912 492l14 8-14 8z" fill="#6d88ad"/>

<rect x="934" y="390" width="164" height="220" rx="20" fill="#fff4f4" stroke="#efc7c9"/>
<text x="956" y="422" font-size="14" font-weight="760" fill="#994148">Execution history</text>
<text x="956" y="458" fill="#85595d">status + attempt</text>
<text x="956" y="486" fill="#85595d">action results</text>
<text x="956" y="514" fill="#85595d">trace id</text>
<text x="956" y="542" fill="#85595d">ChangeSet ids</text>
<text x="956" y="570" fill="#85595d">retry / failure</text>
</g>

<rect x="195" y="730" width="810" height="52" rx="18" fill="#eef4ff" stroke="#cfdcf0"/>
<text x="600" y="762" text-anchor="middle" font-size="16" font-weight="730" fill="#355d97">The database is both the event durability layer and the audit anchor; automation is decoupled from the request that changed the record.</text>
</svg>