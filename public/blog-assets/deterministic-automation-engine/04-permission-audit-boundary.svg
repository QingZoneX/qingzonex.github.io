<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title id="title">QTable automation permission and audit boundary</title>
<desc id="desc">Rules store a run-as user. Definition changes require table edit permission. At runtime QTable rechecks the run-as user's current table permission and row access, rechecks row access before every update, restricts notification recipients to workspace members, and records trace and ChangeSet identifiers in execution history.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="820" rx="34" fill="url(#bg)"/>
<text x="66" y="72" font-size="38" font-weight="760" fill="#0f172a">An enabled rule is not a permanent permission ticket</text>
<text x="66" y="108" font-size="18" fill="#60708a">Automation keeps a run-as identity, but every execution still has to pass the current authorization boundary.</text>
<g filter="url(#shadow)"><rect x="62" y="164" width="1076" height="520" rx="30" fill="#fff" stroke="#d9e4f1"/></g>

<g font-size="13">
<rect x="95" y="214" width="220" height="118" rx="18" fill="#eef4ff" stroke="#cfdcf0"/>
<text x="120" y="244" font-weight="760" fill="#355d97">RULE AUTHORING</text>
<text x="120" y="276" fill="#5d7390">requires table edit permission</text>
<text x="120" y="299" fill="#5d7390">validate trigger / condition / action</text>
<text x="120" y="321" fill="#5d7390">store run_as_user_id</text>

<path d="M329 273H390" stroke="#9eb3cc" stroke-width="4"/><path d="M382 265l14 8-14 8z" fill="#6d88ad"/>

<rect x="404" y="204" width="250" height="138" rx="20" fill="#eef8f4" stroke="#c8e3d6"/>
<text x="430" y="236" font-weight="760" fill="#2d674f">RUNTIME REVALIDATION</text>
<text x="430" y="269" fill="#587568">current table permission</text>
<text x="430" y="293" fill="#587568">current row visibility</text>
<text x="430" y="317" fill="#587568">required permission from actions</text>

<path d="M670 273H730" stroke="#9eb3cc" stroke-width="4"/><path d="M722 265l14 8-14 8z" fill="#6d88ad"/>

<rect x="744" y="204" width="348" height="138" rx="20" fill="#fff9ef" stroke="#ecd6b5"/>
<text x="770" y="236" font-weight="760" fill="#74551f">ACTION-SPECIFIC CHECKS</text>
<text x="770" y="269" fill="#816c4c">update: row access checked again before write</text>
<text x="770" y="293" fill="#816c4c">create: actor = run-as user</text>
<text x="770" y="317" fill="#816c4c">notify: recipients limited to workspace members</text>

<rect x="95" y="420" width="288" height="174" rx="20" fill="#f4effb" stroke="#ddcff0"/>
<text x="120" y="452" font-weight="760" fill="#67478f">EXECUTION IDENTITY</text>
<text x="120" y="487" fill="#715f83">automationVersion</text>
<text x="120" y="512" fill="#715f83">triggerEventId / rootEventId</text>
<text x="120" y="537" fill="#715f83">parentExecutionId / depth</text>
<text x="120" y="562" fill="#715f83">traceId / attempt</text>

<path d="M398 507H452" stroke="#9eb3cc" stroke-width="4"/><path d="M444 499l14 8-14 8z" fill="#6d88ad"/>

<rect x="466" y="420" width="288" height="174" rx="20" fill="#eef8f4" stroke="#c8e3d6"/>
<text x="491" y="452" font-weight="760" fill="#2d674f">BUSINESS AUDIT</text>
<text x="491" y="487" fill="#587568">writes use actor_type = automation</text>
<text x="491" y="512" fill="#587568">source = automation</text>
<text x="491" y="537" fill="#587568">ChangeSets share execution traceId</text>
<text x="491" y="562" fill="#587568">execution stores ChangeSet ids</text>

<path d="M769 507H823" stroke="#9eb3cc" stroke-width="4"/><path d="M815 499l14 8-14 8z" fill="#6d88ad"/>

<rect x="837" y="420" width="255" height="174" rx="20" fill="#fff4f4" stroke="#efc7c9"/>
<text x="862" y="452" font-weight="760" fill="#994148">OPERATIONS UI</text>
<text x="862" y="487" fill="#85595d">status + action results</text>
<text x="862" y="512" fill="#85595d">trace + ChangeSet links</text>
<text x="862" y="537" fill="#85595d">retry failed executions</text>
<text x="862" y="562" fill="#85595d">5s history polling while open</text>
</g>

<rect x="170" y="724" width="860" height="54" rx="18" fill="#eef8f4" stroke="#c8e3d6"/>
<text x="600" y="757" text-anchor="middle" font-size="16" font-weight="730" fill="#285f4b">The rule can outlive the editing session. Its authority cannot outlive the run-as user's current permission.</text>
</svg>