<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
<title id="title">Agent reasoning and deterministic automation serve different jobs</title>
<desc id="desc">Agent reasoning handles ambiguous goals and proposes plans, while deterministic automation handles known triggers, explicit conditions and predefined actions.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
</defs>
<rect width="1200" height="780" rx="34" fill="url(#bg)"/>
<text x="66" y="72" font-size="38" font-weight="760" fill="#0f172a">Not every workflow should become an Agent problem</text>
<text x="66" y="108" font-size="18" fill="#60708a">Use probabilistic reasoning for ambiguity; keep known operational rules deterministic.</text>
<g filter="url(#shadow)">
<rect x="72" y="175" width="490" height="470" rx="28" fill="#fff" stroke="#d9e4f1"/>
<rect x="638" y="175" width="490" height="470" rx="28" fill="#fff" stroke="#d9e4f1"/>
</g>
<text x="105" y="220" font-size="14" font-weight="760" fill="#6d52a3">AGENT RUNTIME</text>
<text x="105" y="258" font-size="27" font-weight="760" fill="#0f172a">Reason about uncertain intent</text>
<g font-size="14">
<rect x="105" y="300" width="424" height="64" rx="14" fill="#f4effb" stroke="#ddcff0"/>
<text x="128" y="328" font-weight="700" fill="#67478f">Input</text><text x="128" y="350" fill="#715f83">goal / question / incomplete context</text>
<rect x="105" y="382" width="424" height="84" rx="14" fill="#f8f6fb" stroke="#e3daee"/>
<text x="128" y="411" font-weight="700" fill="#67478f">Work</text>
<text x="128" y="434" fill="#715f83">interpret → plan → choose tools → propose change</text>
<text x="128" y="455" fill="#715f83">model output may vary across runs</text>
<rect x="105" y="484" width="424" height="90" rx="14" fill="#eef4ff" stroke="#cfdcf0"/>
<text x="128" y="515" font-weight="700" fill="#355d97">Safety boundary</text>
<text x="128" y="538" fill="#5d7390">Preview → Confirm → Apply</text>
<text x="128" y="560" fill="#5d7390">permissions and current state rechecked before write</text>
</g>

<text x="671" y="220" font-size="14" font-weight="760" fill="#2c7659">AUTOMATION ENGINE</text>
<text x="671" y="258" font-size="27" font-weight="760" fill="#0f172a">Execute a known rule repeatedly</text>
<g font-size="14">
<rect x="671" y="300" width="424" height="64" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
<text x="694" y="328" font-weight="700" fill="#2d674f">Trigger</text><text x="694" y="350" fill="#587568">record update / schedule / due date / manual</text>
<rect x="671" y="382" width="424" height="84" rx="14" fill="#f3faf7" stroke="#d3eadf"/>
<text x="694" y="411" font-weight="700" fill="#2d674f">Work</text>
<text x="694" y="434" fill="#587568">match condition → execute predefined actions</text>
<text x="694" y="455" fill="#587568">same event + same rule version → same execution identity</text>
<rect x="671" y="484" width="424" height="90" rx="14" fill="#fff9ef" stroke="#ecd6b5"/>
<text x="694" y="515" font-weight="700" fill="#74551f">Reliability boundary</text>
<text x="694" y="538" fill="#816c4c">idempotency → retry → loop guard → audit trail</text>
<text x="694" y="560" fill="#816c4c">runtime permission revalidation before actions</text>
</g>
<rect x="240" y="690" width="720" height="54" rx="18" fill="#fff" stroke="#d5e1ee"/>
<text x="600" y="723" text-anchor="middle" font-size="16" font-weight="730" fill="#25364e">AI decides when the problem is ambiguous. Automation repeats what the product already knows how to decide.</text>
</svg>