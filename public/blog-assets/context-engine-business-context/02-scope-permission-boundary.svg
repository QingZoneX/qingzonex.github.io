<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Context scope and permission boundaries</title>
  <desc id="desc">QTable builds a scope key from user, workspace and session, then checks effective table permission and row-level policy before creating visibility-aware table context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="780" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">A context must have a boundary before it has content</text>
  <text x="70" y="108" font-size="18" fill="#60708a">Identity and scope come first; table metadata is built only after the current user is allowed to read it.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="176" width="300" height="426" rx="28" fill="#fff" stroke="#d8e4f1"/>
    <rect x="450" y="176" width="300" height="426" rx="28" fill="#fff" stroke="#d8e4f1"/>
    <rect x="830" y="176" width="300" height="426" rx="28" fill="#13243e" stroke="#365777"/>
  </g>

  <text x="98" y="216" font-size="14" font-weight="760" fill="#4d73b7">SCOPE KEY</text>
  <text x="98" y="258" font-size="25" font-weight="750" fill="#0f172a">Who is asking?</text>
  <g font-size="15" fill="#47586f">
    <rect x="98" y="288" width="244" height="48" rx="13" fill="#f8fbff" stroke="#dce6f2"/><text x="118" y="318">user: 42</text>
    <rect x="98" y="350" width="244" height="48" rx="13" fill="#f8fbff" stroke="#dce6f2"/><text x="118" y="380">workspace: w1</text>
    <rect x="98" y="412" width="244" height="48" rx="13" fill="#f8fbff" stroke="#dce6f2"/><text x="118" y="442">session: conv_abc</text>
  </g>
  <text x="98" y="502" font-size="13" fill="#718096">scopeKey</text>
  <text x="98" y="526" font-size="14" font-weight="700" fill="#365f9a">user:42:workspace:w1:session:conv_abc</text>

  <path d="M376 390H442" stroke="#b2c5dc" stroke-width="4" stroke-linecap="round"/>
  <path d="M434 382l14 8-14 8z" fill="#708aae"/>

  <text x="478" y="216" font-size="14" font-weight="760" fill="#9b6a22">ACCESS CHECKS</text>
  <text x="478" y="258" font-size="25" font-weight="750" fill="#0f172a">What may be seen?</text>
  <g font-size="15">
    <rect x="478" y="288" width="244" height="58" rx="14" fill="#fff9f1" stroke="#eed7b6"/><text x="500" y="314" font-weight="700" fill="#654c29">Effective table permission</text><text x="500" y="335" fill="#7d6a4e">must allow read</text>
    <rect x="478" y="362" width="244" height="58" rx="14" fill="#fff9f1" stroke="#eed7b6"/><text x="500" y="388" font-weight="700" fill="#654c29">Row-level policy</text><text x="500" y="409" fill="#7d6a4e">all / creator / member field</text>
    <rect x="478" y="436" width="244" height="58" rx="14" fill="#fff9f1" stroke="#eed7b6"/><text x="500" y="462" font-weight="700" fill="#654c29">Visible record count</text><text x="500" y="483" fill="#7d6a4e">computed from allowed rows</text>
  </g>
  <text x="478" y="535" font-size="13" fill="#8a765b">No read permission → context build fails.</text>

  <path d="M756 390H822" stroke="#b2c5dc" stroke-width="4" stroke-linecap="round"/>
  <path d="M814 382l14 8-14 8z" fill="#708aae"/>

  <text x="858" y="216" font-size="14" font-weight="760" fill="#bcdcff">TABLE CONTEXT</text>
  <text x="858" y="258" font-size="25" font-weight="750" fill="#fff">Visibility-aware shape</text>
  <g font-size="15" fill="#e8f2fb">
    <rect x="858" y="288" width="244" height="48" rx="13" fill="#172d4b" stroke="#406589"/><text x="878" y="318">table id + tableIds</text>
    <rect x="858" y="350" width="244" height="48" rx="13" fill="#172d4b" stroke="#406589"/><text x="878" y="380">field count + sample fields</text>
    <rect x="858" y="412" width="244" height="48" rx="13" fill="#172d4b" stroke="#406589"/><text x="878" y="442">view samples</text>
    <rect x="858" y="474" width="244" height="48" rx="13" fill="#172d4b" stroke="#406589"/><text x="878" y="504">visible record count</text>
  </g>
  <text x="858" y="554" font-size="13" fill="#b8cce1">The current builder does not dump all records here.</text>

  <rect x="168" y="654" width="864" height="76" rx="24" fill="#eef8f4" stroke="#c4e2d4"/>
  <text x="600" y="686" text-anchor="middle" font-size="18" font-weight="740" fill="#1a5541">Context can narrow authority; it must never create authority.</text>
  <text x="600" y="711" text-anchor="middle" font-size="14" fill="#4f7165">Write-time permission and state checks still belong to the domain service.</text>
</svg>