<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Shared QTable domain boundary</title>
  <desc id="desc">Users, agents, and automation pass through shared query and domain services to the same table records and views, with relation, formula, permission, version, and change-history constraints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9fcff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="domain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162947"/><stop offset="1" stop-color="#0d182c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="17" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">One Domain Boundary · Multiple Actors</text>
  <text x="70" y="108" font-size="18" fill="#60708a">Human actions, agents, and automation should meet the same business rules before touching shared state.</text>

