  <circle cx="504" cy="206" r="27" fill="#eaf9f3"/><rect x="491" y="193" width="26" height="24" rx="8" fill="none" stroke="#34775c" stroke-width="3"/><circle cx="499" cy="204" r="2.7" fill="#34775c"/><circle cx="509" cy="204" r="2.7" fill="#34775c"/><path d="M498 212h12" stroke="#34775c" stroke-width="2.5" stroke-linecap="round"/>
