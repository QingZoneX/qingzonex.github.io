  <g filter="url(#shadow)"><rect x="190" y="504" width="820" height="184" rx="30" fill="url(#domain)" stroke="#2d4c73"/></g>
  <text x="228" y="546" font-size="13" font-weight="760" fill="#87b9f7">SHARED BUSINESS STATE</text>
  <text x="228" y="587" font-size="29" font-weight="760" fill="#fff">Table · Record · View</text>
  <text x="228" y="617" font-size="15" fill="#afc3da">The actor changes. The domain objects do not.</text>
