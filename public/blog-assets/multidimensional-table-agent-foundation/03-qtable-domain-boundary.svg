  <rect x="339" y="348" width="146" height="68" rx="18" fill="#f4faf7" stroke="#d0e9dd"/><text x="412" y="377" text-anchor="middle" font-size="16" font-weight="730" fill="#2f7157">Relation</text><text x="412" y="399" text-anchor="middle" font-size="12" fill="#76869c">linked objects</text>
