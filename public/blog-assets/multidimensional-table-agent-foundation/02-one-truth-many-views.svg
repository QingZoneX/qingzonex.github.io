  <text x="67" y="402" font-size="25" font-weight="740" fill="#0f172a">Gantt</text>
  <g fill="#eef4ff"><rect x="180" y="346" width="91" height="12" rx="6"/><rect x="205" y="372" width="67" height="12" rx="6" fill="#dff6ec"/><rect x="164" y="398" width="82" height="12" rx="6" fill="#eee7ff"/><path d="M156 333v91" stroke="#d4dfed" stroke-width="2"/></g>
  <text x="67" y="437" font-size="14" fill="#78869b">Dates + dependencies</text>

