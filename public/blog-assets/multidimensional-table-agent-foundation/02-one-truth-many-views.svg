<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">One record set, many projections</title>
  <desc id="desc">A shared record set in the center is projected into Grid, Kanban, Gantt, Calendar, Dashboard, and Agent experiences without copying the underlying business facts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172946"/><stop offset="1" stop-color="#0e182c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">One Record Set · Many Projections</text>
  <text x="70" y="108" font-size="18" fill="#60708a">Grid, Kanban, Gantt, Calendar, Dashboard, and Agent should share the same business facts.</text>

  <g stroke="#c4d5e9" stroke-width="3" fill="none">
    <path d="M415 300C355 278 330 248 304 219"/>
    <path d="M785 300C845 278 870 248 896 219"/>
