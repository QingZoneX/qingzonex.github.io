    <path d="M795 382C858 382 886 382 926 382"/>
    <path d="M420 466C360 494 332 521 304 552"/>
    <path d="M780 466C840 494 868 521 896 552"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="405" y="245" width="390" height="285" rx="34" fill="url(#core)" stroke="#2d4c73"/>
    <rect x="70" y="145" width="265" height="150" rx="24" fill="#fff" stroke="#d9e4f1"/>
    <rect x="865" y="145" width="265" height="150" rx="24" fill="#fff" stroke="#d9e4f1"/>
    <rect x="45" y="315" width="265" height="150" rx="24" fill="#fff" stroke="#d9e4f1"/>
    <rect x="890" y="315" width="265" height="150" rx="24" fill="#fff" stroke="#d9e4f1"/>
    <rect x="70" y="485" width="265" height="150" rx="24" fill="#fff" stroke="#d9e4f1"/>
    <rect x="865" y="485" width="265" height="150" rx="24" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <rect x="438" y="275" width="128" height="32" rx="16" fill="#294563"/><text x="502" y="296" text-anchor="middle" font-size="13" font-weight="760" fill="#b9d8ff">SOURCE OF TRUTH</text>
  <text x="438" y="356" font-size="34" font-weight="760" fill="#fff">Record Set</text>
  <text x="438" y="389" font-size="17" fill="#b8c9dd">Stable objects, shared business state</text>
  <g font-size="15" fill="#e6eef8">
    <rect x="438" y="420" width="101" height="40" rx="12" fill="#172f50" stroke="#355b84"/><text x="488" y="445" text-anchor="middle">Fields</text>
    <rect x="551" y="420" width="101" height="40" rx="12" fill="#172f50" stroke="#355b84"/><text x="601" y="445" text-anchor="middle">Relations</text>
    <rect x="664" y="420" width="98" height="40" rx="12" fill="#172f50" stroke="#355b84"/><text x="713" y="445" text-anchor="middle">Version</text>
  </g>
  <text x="600" y="500" text-anchor="middle" font-size="14" fill="#8fa8c6">One mutation changes the underlying fact, not six copies.</text>

