  <text x="912" y="402" font-size="25" font-weight="740" fill="#0f172a">Calendar</text>
  <g stroke="#cbd9e9" fill="#f9fbfe"><rect x="1030" y="340" width="92" height="76" rx="9"/><path d="M1030 362h92M1053 362v54M1076 362v54M1099 362v54M1030 380h92M1030 398h92"/><circle cx="1087" cy="389" r="6" fill="#62cba1" stroke="none"/></g>
  <text x="912" y="437" font-size="14" fill="#78869b">Time projection</text>

  <rect x="92" y="508" width="76" height="28" rx="14" fill="#eaf6ff"/><text x="130" y="527" text-anchor="middle" font-size="12" font-weight="760" fill="#31678f">VIEW</text>
  <text x="92" y="572" font-size="25" font-weight="740" fill="#0f172a">Dashboard</text>
  <g fill="#eef4ff"><rect x="205" y="512" width="96" height="78" rx="10" stroke="#c6d7ea"/><rect x="219" y="558" width="13" height="20" rx="3" fill="#7da7ff"/><rect x="240" y="542" width="13" height="36" rx="3" fill="#69c8a0"/><rect x="261" y="530" width="13" height="48" rx="3" fill="#a88cf4"/><rect x="282" y="548" width="8" height="30" rx="3" fill="#f1b463"/></g>
  <text x="92" y="607" font-size="14" fill="#78869b">Aggregated facts</text>

  <rect x="887" y="508" width="84" height="28" rx="14" fill="#e8efff"/><text x="929" y="527" text-anchor="middle" font-size="12" font-weight="760" fill="#385f9f">ACTOR</text>
  <text x="887" y="572" font-size="25" font-weight="740" fill="#0f172a">Agent</text>
  <circle cx="1059" cy="546" r="37" fill="#152846"/><circle cx="1047" cy="541" r="5" fill="#9fc9ff"/><circle cx="1071" cy="541" r="5" fill="#9fc9ff"/><path d="M1046 560c9 8 18 8 27 0" fill="none" stroke="#61d5a5" stroke-width="3" stroke-linecap="round"/>
  <text x="887" y="607" font-size="14" fill="#78869b">Query + mutate facts</text>

  <rect x="251" y="678" width="698" height="42" rx="21" fill="#eef8f4" stroke="#c8e5d8"/>
  <text x="600" y="704" text-anchor="middle" font-size="15" font-weight="700" fill="#285e4c">Different experiences should not create different versions of reality.</text>
</svg>
