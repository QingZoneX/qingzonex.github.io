<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="title">QTable 的统一产品模型</title>
  <desc id="desc">Web、API、AI、自动化、Dashboard、搜索与附件都围绕统一的 Table、Record、View、Permission、ChangeSet 和 Workspace Context 工作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#152441"/><stop offset="1" stop-color="#0d172b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="800" rx="34" fill="url(#bg)"/>
  <text x="70" y="70" font-size="38" font-weight="750" fill="#0f172a">QTable 的核心不是功能堆叠，而是统一产品模型</text>
  <text x="70" y="108" font-size="19" fill="#60708a">AI 不走旁路。所有交互最终都回到同一套业务对象、权限与变更语义。</text>

  <g stroke="#c8d7eb" stroke-width="3" fill="none">
    <path d="M265 245 C390 245 450 330 500 365"/>
    <path d="M600 190 V300"/>
    <path d="M935 245 C810 245 750 330 700 365"/>
    <path d="M265 565 C390 565 450 485 500 445"/>
    <path d="M600 620 V500"/>
    <path d="M935 565 C810 565 750 485 700 445"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="145" y="195" width="240" height="100" rx="22" fill="#fff" stroke="#dbe5f2"/>
    <rect x="480" y="140" width="240" height="100" rx="22" fill="#fff" stroke="#dbe5f2"/>
    <rect x="815" y="195" width="240" height="100" rx="22" fill="#fff" stroke="#dbe5f2"/>
    <rect x="145" y="515" width="240" height="100" rx="22" fill="#fff" stroke="#dbe5f2"/>
    <rect x="480" y="570" width="240" height="100" rx="22" fill="#fff" stroke="#dbe5f2"/>
    <rect x="815" y="515" width="240" height="100" rx="22" fill="#fff" stroke="#dbe5f2"/>
  </g>

  <rect x="167" y="217" width="36" height="36" rx="11" fill="#e8efff" stroke="#aac4ff"/><text x="220" y="242" font-size="23" font-weight="720" fill="#0f172a">Web App</text><text x="167" y="276" font-size="16" fill="#5a6a82">Grid · Kanban · Gantt</text>
  <rect x="502" y="162" width="36" height="36" rx="11" fill="#e7f2ff" stroke="#acd3ff"/><text x="555" y="187" font-size="23" font-weight="720" fill="#0f172a">API</text><text x="502" y="221" font-size="16" fill="#5a6a82">GraphQL · REST · Integration</text>
  <rect x="837" y="217" width="36" height="36" rx="11" fill="#e9fbf3" stroke="#aee1cb"/><text x="890" y="242" font-size="23" font-weight="720" fill="#0f172a">AI</text><text x="837" y="276" font-size="16" fill="#5a6a82">Plan · Preview · Apply</text>
  <rect x="167" y="537" width="36" height="36" rx="11" fill="#f0ebff" stroke="#c8b8ff"/><text x="220" y="562" font-size="23" font-weight="720" fill="#0f172a">Automation</text><text x="167" y="596" font-size="16" fill="#5a6a82">Rules · Jobs · Triggers</text>
  <rect x="502" y="592" width="36" height="36" rx="11" fill="#fff3e7" stroke="#ffd0a0"/><text x="555" y="617" font-size="23" font-weight="720" fill="#0f172a">Dashboard</text><text x="502" y="651" font-size="16" fill="#5a6a82">Widgets · Metrics · Share</text>
  <rect x="837" y="537" width="36" height="36" rx="11" fill="#e7f8fb" stroke="#9edbe5"/><text x="890" y="562" font-size="23" font-weight="720" fill="#0f172a">Search &amp; Files</text><text x="837" y="596" font-size="16" fill="#5a6a82">Inbox · Attachments · Retrieval</text>

  <g filter="url(#shadow)"><rect x="360" y="300" width="480" height="210" rx="34" fill="url(#core)"/></g>
  <rect x="380" y="320" width="440" height="170" rx="27" fill="none" stroke="#66adff" stroke-width="2.5"/>
  <text x="600" y="370" text-anchor="middle" font-size="38" font-weight="760" fill="#fff">QTable Core</text>
  <text x="600" y="416" text-anchor="middle" font-size="27" font-weight="720" fill="#91c7ff">Table · Record · View</text>
  <text x="600" y="454" text-anchor="middle" font-size="18" fill="#cfddf1">Permission · ChangeSet · Workspace Context</text>
  <text x="600" y="484" text-anchor="middle" font-size="15" fill="#8ea4c2">One source of truth · One permission model · One audit trail</text>
</svg>
