<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="title">Preview → Confirm → Apply 安全执行流程</title>
  <desc id="desc">AI 先生成结构化变更方案，用户确认后，系统重新校验权限、上下文和并发状态，再执行并记录审计轨迹。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#f0f5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <text x="70" y="70" font-size="38" font-weight="750" fill="#0f172a">让 AI 进入真实业务场景的关键：Preview → Confirm → Apply</text>
  <text x="70" y="108" font-size="19" fill="#60708a">真正可落地的 AI，不是“想到就执行”，而是把人的控制权和系统校验写进执行链路。</text>

  <g filter="url(#shadow)">
    <rect x="80" y="180" width="275" height="245" rx="28" fill="#fff" stroke="#dce5f2"/>
    <rect x="462" y="180" width="275" height="245" rx="28" fill="#fff" stroke="#dce5f2"/>
    <rect x="845" y="180" width="275" height="245" rx="28" fill="#fff" stroke="#dce5f2"/>
  </g>

  <circle cx="126" cy="226" r="21" fill="#e8efff" stroke="#aec4ff"/><text x="126" y="233" text-anchor="middle" font-size="18" font-weight="750" fill="#4167c9">1</text>
  <text x="165" y="235" font-size="29" font-weight="740" fill="#0f172a">Preview</text>
  <text x="108" y="291" font-size="18" fill="#51617a">AI 先输出结构化变更方案：</text>
  <text x="108" y="327" font-size="17" fill="#69778d">• 要创建 / 修改哪些对象</text>
  <text x="108" y="357" font-size="17" fill="#69778d">• 任务、负责人、排期如何变化</text>
  <text x="108" y="387" font-size="17" fill="#69778d">• 变更影响范围是什么</text>

  <path d="M355 303 H445" stroke="#b9cae4" stroke-width="5" stroke-linecap="round"/><path d="M431 291 L447 303 L431 315" fill="none" stroke="#b9cae4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="508" cy="226" r="21" fill="#e9faf2" stroke="#aee0ca"/><text x="508" y="233" text-anchor="middle" font-size="18" font-weight="750" fill="#287256">2</text>
  <text x="547" y="235" font-size="29" font-weight="740" fill="#0f172a">Confirm</text>
  <text x="490" y="291" font-size="18" fill="#51617a">人类确认的是“意图与影响”，</text>
  <text x="490" y="320" font-size="18" fill="#51617a">而不是给 AI 一张永久通行证。</text>
  <text x="490" y="361" font-size="17" fill="#69778d">Accept · Edit · Reject</text>
  <text x="490" y="391" font-size="17" fill="#69778d">保留明确的人类控制点</text>

  <path d="M737 303 H828" stroke="#b9cae4" stroke-width="5" stroke-linecap="round"/><path d="M814 291 L830 303 L814 315" fill="none" stroke="#b9cae4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="891" cy="226" r="21" fill="#f0ebff" stroke="#c7b8ff"/><text x="891" y="233" text-anchor="middle" font-size="18" font-weight="750" fill="#694fd0">3</text>
  <text x="930" y="235" font-size="29" font-weight="740" fill="#0f172a">Apply</text>
  <text x="873" y="291" font-size="18" fill="#51617a">真正执行前重新验证：</text>
  <text x="873" y="327" font-size="17" fill="#69778d">• 当前用户权限</text>
  <text x="873" y="357" font-size="17" fill="#69778d">• Context freshness</text>
  <text x="873" y="387" font-size="17" fill="#69778d">• 并发与业务状态</text>

  <g filter="url(#shadow)"><rect x="135" y="500" width="930" height="142" rx="26" fill="#111d35"/></g>
  <text x="172" y="542" font-size="23" font-weight="720" fill="#fff">Execution guardrails</text>
  <g font-size="18" fill="#d5e1f1">
    <circle cx="177" cy="580" r="7" fill="#45c593"/><text x="195" y="586">Permission recheck</text>
    <circle cx="420" cy="580" r="7" fill="#45c593"/><text x="438" y="586">Context freshness</text>
    <circle cx="675" cy="580" r="7" fill="#45c593"/><text x="693" y="586">Concurrency guard</text>
    <circle cx="900" cy="580" r="7" fill="#45c593"/><text x="918" y="586">ChangeSet / Audit</text>
  </g>
  <text x="600" y="620" text-anchor="middle" font-size="15" fill="#91a8c5">Preview 是系统边界，而不是一个 UI 动画；Apply 时的重新校验才让 AI 能进入真实业务。</text>
</svg>
