<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Preview Confirm Apply as an execution boundary</title>
  <desc id="desc">A three-stage AI write path where preview creates a reviewable plan without business writes, confirmation selects intended actions, and apply revalidates current state before committing audited changes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172944"/><stop offset="1" stop-color="#0d172b"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9fbf4"/><stop offset="1" stop-color="#e8f5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">Preview → Confirm → Apply</text>
  <text x="70" y="108" font-size="18" fill="#60708a">An AI write becomes trustworthy when intent and mutation are separated by review and revalidation.</text>

  <g stroke="#c7d6e9" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M392 338H454"/><path d="M746 338H808"/>
  </g>
  <g fill="#6682aa"><path d="M446 330l14 8-14 8z"/><path d="M800 330l14 8-14 8z"/></g>

  <g filter="url(#shadow)">
    <rect x="60" y="164" width="332" height="402" rx="28" fill="#fff" stroke="#d8e3f0"/>
    <rect x="454" y="164" width="292" height="402" rx="28" fill="#fff" stroke="#d8e3f0"/>
    <rect x="808" y="164" width="332" height="402" rx="28" fill="url(#dark)" stroke="#315075"/>
  </g>

  <rect x="86" y="190" width="88" height="30" rx="15" fill="#eaf0ff"/>
  <text x="130" y="210" text-anchor="middle" font-size="13" font-weight="760" fill="#3d62a0">01 · PLAN</text>
  <text x="86" y="262" font-size="31" font-weight="760" fill="#0f172a">Preview</text>
  <text x="86" y="294" font-size="16" fill="#6b7890">Build a reviewable proposal</text>
  <g font-size="15" fill="#42526a">
    <rect x="86" y="326" width="280" height="46" rx="13" fill="#f8fbff" stroke="#dfe8f3"/><text x="108" y="355">Resolve schema + visible records</text>
    <rect x="86" y="384" width="280" height="46" rx="13" fill="#f8fbff" stroke="#dfe8f3"/><text x="108" y="413">Capture current values + versions</text>
    <rect x="86" y="442" width="280" height="46" rx="13" fill="#f8fbff" stroke="#dfe8f3"/><text x="108" y="471">Normalize reason, risk, confidence</text>
  </g>
  <circle cx="106" cy="522" r="7" fill="#52b892"/><text x="124" y="528" font-size="14" font-weight="700" fill="#34745d">NO BUSINESS WRITE</text>

  <rect x="480" y="190" width="102" height="30" rx="15" fill="#fff2df"/>
  <text x="531" y="210" text-anchor="middle" font-size="13" font-weight="760" fill="#94601d">02 · REVIEW</text>
  <text x="480" y="262" font-size="31" font-weight="760" fill="#0f172a">Confirm</text>
  <text x="480" y="294" font-size="16" fill="#6b7890">Human decides what proceeds</text>
  <rect x="480" y="326" width="240" height="162" rx="18" fill="#fffbf5" stroke="#efd9b4"/>
  <g font-size="15" fill="#48576d">
    <rect x="500" y="348" width="22" height="22" rx="6" fill="#fff" stroke="#d8b77e"/><path d="M505 359l5 5 8-10" fill="none" stroke="#9a6b25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="536" y="365">assign owner</text>
    <rect x="500" y="390" width="22" height="22" rx="6" fill="#fff" stroke="#d8b77e"/><path d="M505 401l5 5 8-10" fill="none" stroke="#9a6b25" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="536" y="407">change deadline</text>
    <rect x="500" y="432" width="22" height="22" rx="6" fill="#fff" stroke="#d8b77e"/><text x="536" y="449">skip low-confidence action</text>
  </g>
  <text x="480" y="522" font-size="14" font-weight="700" fill="#8b642a">SELECTED ACTION IDs ONLY</text>

  <rect x="834" y="190" width="96" height="30" rx="15" fill="#294665"/>
  <text x="882" y="210" text-anchor="middle" font-size="13" font-weight="760" fill="#bfdbff">03 · WRITE</text>
  <text x="834" y="262" font-size="31" font-weight="760" fill="#fff">Apply</text>
  <text x="834" y="294" font-size="16" fill="#b7c8dc">Revalidate, then mutate</text>
  <g font-size="15">
    <rect x="834" y="326" width="280" height="46" rx="13" fill="#152844" stroke="#3e628b"/><circle cx="856" cy="349" r="7" fill="#63d2a7"/><text x="874" y="355" fill="#eaf3fb">Permission + row access</text>
    <rect x="834" y="384" width="280" height="46" rx="13" fill="#152844" stroke="#3e628b"/><circle cx="856" cy="407" r="7" fill="#63d2a7"/><text x="874" y="413" fill="#eaf3fb">Schema + relation validity</text>
    <rect x="834" y="442" width="280" height="46" rx="13" fill="#152844" stroke="#3e628b"/><circle cx="856" cy="465" r="7" fill="#63d2a7"/><text x="874" y="471" fill="#eaf3fb">Record version + current state</text>
  </g>
  <text x="834" y="522" font-size="14" font-weight="700" fill="#8fe2c2">COMMIT + CHANGESET</text>

  <rect x="180" y="620" width="840" height="78" rx="24" fill="url(#green)" stroke="#c4e4d5"/>
  <text x="600" y="653" text-anchor="middle" font-size="18" font-weight="740" fill="#174f3e">Preview explains intent. Confirm grants scope. Apply proves the write is still valid.</text>
  <text x="600" y="680" text-anchor="middle" font-size="15" fill="#4d7064">The boundary is valuable precisely because the world may change between the three stages.</text>
</svg>