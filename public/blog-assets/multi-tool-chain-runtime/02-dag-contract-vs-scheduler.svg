<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">DAG contract versus current scheduler</title>
  <desc id="desc">The ToolChainPlan contract can express a dependency graph with parallel branches, while the current dedicated ToolChainRuntimeService executes plan steps in declaration order and checks whether dependencies have already completed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">The graph contract is ahead of the scheduler</text>
  <text x="70" y="108" font-size="18" fill="#60708a">QTable can describe dependencies today; the dedicated Tool Chain executor is not yet a full parallel DAG scheduler.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="166" width="500" height="510" rx="30" fill="#fff" stroke="#d9e4f1"/>
    <rect x="640" y="166" width="500" height="510" rx="30" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="90" y="208" font-size="14" font-weight="760" fill="#4d74b9">PLAN CONTRACT</text>
  <text x="90" y="249" font-size="25" font-weight="750" fill="#0f172a">What dependsOn can express</text>

  <rect x="230" y="292" width="160" height="58" rx="15" fill="#eef4ff" stroke="#cbdaf0"/>
  <text x="310" y="327" text-anchor="middle" font-size="15" font-weight="720" fill="#355d97">split_task</text>

  <path d="M310 350V392" stroke="#aebfd5" stroke-width="3"/>
  <path d="M310 374H160V392" stroke="#aebfd5" stroke-width="3" fill="none"/>
  <path d="M310 374H460V392" stroke="#aebfd5" stroke-width="3" fill="none"/>

  <rect x="90" y="392" width="140" height="58" rx="15" fill="#f8fbff" stroke="#dce6f2"/>
  <text x="160" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#455870">estimate</text>
  <rect x="240" y="392" width="140" height="58" rx="15" fill="#f8fbff" stroke="#dce6f2"/>
  <text x="310" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#455870">gantt</text>
  <rect x="390" y="392" width="140" height="58" rx="15" fill="#fff9ef" stroke="#ecd6b5"/>
  <text x="460" y="427" text-anchor="middle" font-size="14" font-weight="700" fill="#75551f">schema</text>

  <path d="M160 450V500H310" stroke="#aebfd5" stroke-width="3" fill="none"/>
  <path d="M310 450V500" stroke="#aebfd5" stroke-width="3"/>
  <path d="M460 450V500H310" stroke="#aebfd5" stroke-width="3" fill="none"/>
  <rect x="220" y="500" width="180" height="62" rx="16" fill="#eef8f4" stroke="#c6e2d4"/>
  <text x="310" y="537" text-anchor="middle" font-size="15" font-weight="720" fill="#2b664f">create_records</text>
  <text x="90" y="610" font-size="13" fill="#66758a">The contract also produces a LangGraph-style</text>
  <text x="90" y="632" font-size="13" fill="#66758a">nodes / edges specification for future mapping.</text>

  <text x="670" y="208" font-size="14" font-weight="760" fill="#a06a1d">CURRENT DEDICATED EXECUTOR</text>
  <text x="670" y="249" font-size="25" font-weight="750" fill="#0f172a">What _run_internal does now</text>
  <g font-size="14">
    <rect x="670" y="288" width="440" height="62" rx="15" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="692" y="314" font-weight="700" fill="#6f511f">1 · for step in plan.steps</text>
    <text x="692" y="336" fill="#816b4b">declaration order drives execution</text>

    <rect x="670" y="366" width="440" height="62" rx="15" fill="#f8fbff" stroke="#dce6f2"/>
    <text x="692" y="392" font-weight="700" fill="#455870">2 · check dependency state</text>
    <text x="692" y="414" fill="#6d7a8d">unresolved dependency → skipped</text>

    <rect x="670" y="444" width="440" height="62" rx="15" fill="#f8fbff" stroke="#dce6f2"/>
    <text x="692" y="470" font-weight="700" fill="#455870">3 · execute one ToolExecutor call</text>
    <text x="692" y="492" fill="#6d7a8d">wait for result before moving to next step</text>

    <rect x="670" y="522" width="440" height="74" rx="15" fill="#fff4f4" stroke="#efc8ca"/>
    <text x="692" y="550" font-weight="700" fill="#9a4147">No ready queue / fan-out here yet</text>
    <text x="692" y="573" fill="#8a5a5e">parallel branches are a target, not something</text>
    <text x="692" y="592" fill="#8a5a5e">this path should currently claim as complete</text>
  </g>
  <text x="670" y="632" font-size="13" fill="#66758a">A separate Agent Runtime path already uses asyncio.gather</text>
  <text x="670" y="652" font-size="13" fill="#66758a">for batches, but its general DAG batching still needs hardening.</text>

  <rect x="168" y="720" width="864" height="60" rx="22" fill="#eef8f4" stroke="#c7e3d6"/>
  <text x="600" y="756" text-anchor="middle" font-size="17" font-weight="735" fill="#225d48">Honest architecture means separating the data model for a DAG from a scheduler that can truly execute one.</text>
</svg>