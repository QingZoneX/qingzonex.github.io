<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Retry confirmation and rollback boundaries</title>
  <desc id="desc">A tool-chain step can retry safe failures, pause when confirmation is required, and trigger reverse-order rollback of completed steps when a later step fails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafcff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182b48"/><stop offset="1" stop-color="#0d182b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="820" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">Failure handling belongs in the runtime, not in the prompt</text>
  <text x="70" y="108" font-size="18" fill="#60708a">Retries, confirmation pauses, timeouts, and compensating actions are explicit execution rules.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="330" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="435" y="170" width="330" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="810" y="170" width="330" height="500" rx="28" fill="url(#dark)" stroke="#365879"/>
  </g>

  <text x="88" y="210" font-size="14" font-weight="760" fill="#4d74b9">RETRY</text>
  <text x="88" y="250" font-size="25" font-weight="750" fill="#0f172a">Retry only when safe</text>
  <rect x="88" y="282" width="274" height="74" rx="15" fill="#f8fbff" stroke="#dce6f2"/>
  <text x="108" y="309" font-size="14" font-weight="700" fill="#465a72">ToolRetryConfig</text>
  <text x="108" y="332" font-size="13" fill="#718096">maxAttempts + backoffMs</text>
  <rect x="88" y="372" width="274" height="92" rx="15" fill="#eef8f4" stroke="#c8e3d6"/>
  <text x="108" y="398" font-size="14" font-weight="700" fill="#2d674f">Retryable errors</text>
  <text x="108" y="421" font-size="13" fill="#587568">INVALID_INPUT / EXECUTION_FAILED</text>
  <text x="108" y="443" font-size="13" fill="#587568">subject to attempt budget</text>
  <rect x="88" y="480" width="274" height="106" rx="15" fill="#fff4f4" stroke="#efc7c9"/>
  <text x="108" y="507" font-size="14" font-weight="700" fill="#994148">Important brake</text>
  <text x="108" y="530" font-size="13" fill="#85595d">confirmed side-effectful tools are</text>
  <text x="108" y="551" font-size="13" fill="#85595d">not automatically retried when the</text>
  <text x="108" y="572" font-size="13" fill="#85595d">skill is not declared idempotent</text>

  <text x="463" y="210" font-size="14" font-weight="760" fill="#a06a1d">CONFIRMATION</text>
  <text x="463" y="250" font-size="25" font-weight="750" fill="#0f172a">Pause the side effect</text>
  <rect x="463" y="284" width="274" height="70" rx="15" fill="#fff9ef" stroke="#ecd6b5"/>
  <text x="483" y="311" font-size="14" font-weight="700" fill="#72531f">requires_confirmation</text>
  <text x="483" y="334" font-size="13" fill="#826d4d">step → waiting_confirmation</text>
  <path d="M600 354V398" stroke="#c3ad89" stroke-width="3"/>
  <rect x="463" y="398" width="274" height="94" rx="15" fill="#f8fbff" stroke="#dce6f2"/>
  <text x="483" y="425" font-size="14" font-weight="700" fill="#475a72">Persist pending state</text>
  <text x="483" y="448" font-size="13" fill="#718096">stepId · skillName · arguments</text>
  <text x="483" y="469" font-size="13" fill="#718096">preview metadata · memory</text>
  <rect x="463" y="510" width="274" height="76" rx="15" fill="#fff4f4" stroke="#efc7c9"/>
  <text x="483" y="537" font-size="14" font-weight="700" fill="#994148">Current gap</text>
  <text x="483" y="560" font-size="13" fill="#85595d">Tool Chain API has no same-run</text>
  <text x="483" y="580" font-size="13" fill="#85595d">resume / confirm endpoint yet</text>

  <text x="838" y="210" font-size="14" font-weight="760" fill="#bcdcff">ROLLBACK</text>
  <text x="838" y="250" font-size="25" font-weight="750" fill="#fff">Compensate in reverse</text>
  <g font-size="13" fill="#e8f2fb">
    <rect x="838" y="284" width="274" height="62" rx="14" fill="#172d4b" stroke="#406589"/>
    <text x="858" y="310" font-weight="700">completed steps</text><text x="858" y="331" fill="#b8cce1">A → B → C</text>
    <rect x="838" y="364" width="274" height="62" rx="14" fill="#172d4b" stroke="#406589"/>
    <text x="858" y="390" font-weight="700">later step fails</text><text x="858" y="411" fill="#b8cce1">D → failed</text>
    <rect x="838" y="444" width="274" height="84" rx="14" fill="#24476c"/>
    <text x="858" y="470" font-weight="700">reverse compensation</text>
    <text x="858" y="492" fill="#c6daee">C → B → A</text>
    <text x="858" y="514" fill="#c6daee">delete-created-records or rollback skill</text>
  </g>
  <text x="838" y="566" font-size="13" fill="#b8cce1">Rollback is compensation, not a universal</text>
  <text x="838" y="586" font-size="13" fill="#b8cce1">database transaction across all tools.</text>

  <rect x="160" y="718" width="880" height="62" rx="22" fill="#fff" stroke="#d5e1ee"/>
  <text x="600" y="755" text-anchor="middle" font-size="17" font-weight="730" fill="#25364e">A robust chain needs explicit failure semantics before it needs more autonomous planning.</text>
</svg>