<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">Read-time filtering and write-time revalidation</title>
  <desc id="desc">AI context is built only from records visible to the authenticated user. Later, Action Plan Apply reloads the user-scoped plan and rechecks update permission and row access before writing, protecting against permission changes after preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafcff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="840" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">Permission is checked before reasoning and before writing</text>
  <text x="70" y="108" font-size="18" fill="#60708a">A safe Preview does not become permanent authority; Apply must face current permissions again.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="174" width="300" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="450" y="174" width="300" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="840" y="174" width="300" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="90" y="214" font-size="14" font-weight="760" fill="#4d74b9">READ / CONTEXT</text>
  <text x="90" y="254" font-size="25" font-weight="750" fill="#0f172a">Build from visible data</text>
  <g font-size="13">
    <rect x="90" y="292" width="240" height="62" rx="14" fill="#f7faff" stroke="#dce6f2"/>
    <text x="110" y="319" font-weight="700" fill="#455a72">Table permission</text><text x="110" y="341" fill="#718096">must allow read</text>
    <rect x="90" y="370" width="240" height="62" rx="14" fill="#f7faff" stroke="#dce6f2"/>
    <text x="110" y="397" font-weight="700" fill="#455a72">Row policy</text><text x="110" y="419" fill="#718096">filter before prompt / analytics</text>
    <rect x="90" y="448" width="240" height="78" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="110" y="475" font-weight="700" fill="#2d674f">Context / Preview</text>
    <text x="110" y="498" fill="#587568">contains only the user's</text>
    <text x="110" y="518" fill="#587568">current visible business scope</text>
  </g>

  <path d="M368 424H442" stroke="#afc2da" stroke-width="4"/><path d="M434 416l14 8-14 8z" fill="#6d88ad"/>

  <text x="480" y="214" font-size="14" font-weight="760" fill="#8c6926">TIME PASSES</text>
  <text x="480" y="254" font-size="25" font-weight="750" fill="#0f172a">The world may change</text>
  <rect x="480" y="296" width="240" height="78" rx="15" fill="#fff9ef" stroke="#ecd6b5"/>
  <text x="500" y="324" font-size="13" font-weight="700" fill="#74551f">User confirms a Preview</text>
  <text x="500" y="347" font-size="13" fill="#816c4c">but confirmation is not permission</text>
  <rect x="480" y="394" width="240" height="122" rx="15" fill="#fff4f4" stroke="#efc7c9"/>
  <text x="500" y="422" font-size="14" font-weight="700" fill="#994148">Meanwhile...</text>
  <text x="500" y="447" font-size="13" fill="#85595d">table permission can change</text>
  <text x="500" y="469" font-size="13" fill="#85595d">row visibility can change</text>
  <text x="500" y="491" font-size="13" fill="#85595d">schema / relation can change</text>
  <text x="500" y="513" font-size="13" fill="#85595d">record version can change</text>

  <path d="M758 424H832" stroke="#afc2da" stroke-width="4"/><path d="M824 416l14 8-14 8z" fill="#6d88ad"/>

  <text x="870" y="214" font-size="14" font-weight="760" fill="#2c7659">APPLY / WRITE</text>
  <text x="870" y="254" font-size="25" font-weight="750" fill="#0f172a">Revalidate current reality</text>
  <g font-size="13">
    <rect x="870" y="292" width="240" height="56" rx="13" fill="#eef8f4" stroke="#c8e3d6"/><text x="890" y="325" fill="#315f50">plan still belongs to user</text>
    <rect x="870" y="364" width="240" height="56" rx="13" fill="#eef8f4" stroke="#c8e3d6"/><text x="890" y="397" fill="#315f50">table still allows update</text>
    <rect x="870" y="436" width="240" height="56" rx="13" fill="#eef8f4" stroke="#c8e3d6"/><text x="890" y="469" fill="#315f50">record is still accessible</text>
    <rect x="870" y="508" width="240" height="70" rx="13" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="890" y="536" fill="#315f50">member / relation / version</text>
    <text x="890" y="557" fill="#315f50">still satisfy current rules</text>
  </g>
  <text x="870" y="620" font-size="13" font-weight="700" fill="#2d674f">If not → reject and regenerate.</text>

  <rect x="150" y="720" width="900" height="72" rx="22" fill="#fff" stroke="#d5e1ee"/>
  <text x="600" y="752" text-anchor="middle" font-size="17" font-weight="735" fill="#25364e">Context is evidence for reasoning. Confirmation is intent. Neither one is a durable authorization grant.</text>
  <text x="600" y="777" text-anchor="middle" font-size="14" fill="#60708a">The write service must still decide whether the current user is allowed to perform the action now.</text>
</svg>