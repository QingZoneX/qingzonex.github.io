<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc" font-family="Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <title id="title">QTable layered permission model</title>
  <desc id="desc">Workspace membership gives a fallback permission, item overrides can narrow or change inherited permissions, and row-level policies further restrict visible records. Row rules never grant access denied at the table layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="840" rx="34" fill="url(#bg)"/>
  <text x="70" y="72" font-size="38" font-weight="760" fill="#0f172a">Permission is a narrowing pipeline</text>
  <text x="70" y="108" font-size="18" fill="#60708a">Workspace role establishes a fallback. Item permission and row policy can only constrain what the user may do and see.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="174" width="310" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="445" y="174" width="310" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
    <rect x="820" y="174" width="310" height="500" rx="28" fill="#fff" stroke="#d9e4f1"/>
  </g>

  <text x="100" y="215" font-size="14" font-weight="760" fill="#4d74b9">1 · WORKSPACE / ITEM</text>
  <text x="100" y="256" font-size="25" font-weight="750" fill="#0f172a">Effective table permission</text>
  <g font-size="13">
    <rect x="100" y="294" width="250" height="55" rx="13" fill="#f7faff" stroke="#dce6f2"/><text x="120" y="327" fill="#475a72">owner → manage</text>
    <rect x="100" y="363" width="250" height="55" rx="13" fill="#f7faff" stroke="#dce6f2"/><text x="120" y="396" fill="#475a72">editor → edit</text>
    <rect x="100" y="432" width="250" height="55" rx="13" fill="#f7faff" stroke="#dce6f2"/><text x="120" y="465" fill="#475a72">viewer → read</text>
    <rect x="100" y="507" width="250" height="84" rx="14" fill="#eef4ff" stroke="#cfdcf0"/>
    <text x="120" y="534" font-weight="700" fill="#355d97">Item override / inheritance</text>
    <text x="120" y="557" fill="#5d7390">nearest explicit override wins;</text>
    <text x="120" y="578" fill="#5d7390">otherwise fall back to role</text>
  </g>
  <text x="100" y="627" font-size="13" fill="#66758a">Permission ladder:</text>
  <text x="100" y="648" font-size="13" font-weight="700" fill="#405570">read → update → edit → manage</text>

  <path d="M387 424H437" stroke="#afc2da" stroke-width="4"/><path d="M429 416l14 8-14 8z" fill="#6d88ad"/>

  <text x="475" y="215" font-size="14" font-weight="760" fill="#8c6926">2 · ROW POLICY</text>
  <text x="475" y="256" font-size="25" font-weight="750" fill="#0f172a">Visible records</text>
  <g font-size="13">
    <rect x="475" y="294" width="250" height="68" rx="14" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="495" y="321" font-weight="700" fill="#74551f">all</text><text x="495" y="344" fill="#816c4c">no extra row restriction</text>
    <rect x="475" y="378" width="250" height="68" rx="14" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="495" y="405" font-weight="700" fill="#74551f">creator</text><text x="495" y="428" fill="#816c4c">own created rows remain visible</text>
    <rect x="475" y="462" width="250" height="82" rx="14" fill="#fff9ef" stroke="#ecd6b5"/>
    <text x="495" y="489" font-weight="700" fill="#74551f">member_field</text>
    <text x="495" y="512" fill="#816c4c">creator or user referenced</text>
    <text x="495" y="532" fill="#816c4c">by the configured member field</text>
  </g>
  <rect x="475" y="570" width="250" height="72" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
  <text x="495" y="598" font-size="13" font-weight="700" fill="#2d674f">Managers keep full-table visibility</text>
  <text x="495" y="621" font-size="13" fill="#587568">so policy cannot lock them out.</text>

  <path d="M762 424H812" stroke="#afc2da" stroke-width="4"/><path d="M804 416l14 8-14 8z" fill="#6d88ad"/>

  <text x="850" y="215" font-size="14" font-weight="760" fill="#2c7659">3 · TOOL / DOMAIN</text>
  <text x="850" y="256" font-size="25" font-weight="750" fill="#0f172a">Action must still fit</text>
  <g font-size="13">
    <rect x="850" y="294" width="250" height="62" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="870" y="321" font-weight="700" fill="#2d674f">Read Tool</text><text x="870" y="343" fill="#587568">requires table read</text>
    <rect x="850" y="372" width="250" height="62" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="870" y="399" font-weight="700" fill="#2d674f">Write Tool</text><text x="870" y="421" fill="#587568">requires write threshold</text>
    <rect x="850" y="450" width="250" height="86" rx="14" fill="#eef8f4" stroke="#c8e3d6"/>
    <text x="870" y="477" font-weight="700" fill="#2d674f">Record operation</text>
    <text x="870" y="500" fill="#587568">must still pass current row access</text>
    <text x="870" y="521" fill="#587568">and domain validation</text>
  </g>
  <text x="850" y="585" font-size="13" fill="#66758a">Row policy never upgrades a user</text>
  <text x="850" y="607" font-size="13" fill="#66758a">who failed table-level access.</text>

  <rect x="170" y="720" width="860" height="70" rx="22" fill="#fff" stroke="#d5e1ee"/>
  <text x="600" y="751" text-anchor="middle" font-size="17" font-weight="735" fill="#25364e">Authorization is intersection, not addition.</text>
  <text x="600" y="775" text-anchor="middle" font-size="14" fill="#60708a">Every layer can reduce capability; no downstream layer should manufacture new authority.</text>
</svg>